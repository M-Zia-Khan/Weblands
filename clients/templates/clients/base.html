<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Website Health Check{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #10233f; color: #fff; padding: 1rem max(1.25rem, calc((100% - 1120px)/2)); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    header a { color: #d7e9ff; text-decoration: none; }
    main { max-width: 1120px; margin: 2rem auto; padding: 0 1.25rem 3rem; }
    h1 { margin-top: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); }
    h2 { font-size: 1.2rem; }
    .card { background: #fff; border: 1px solid #dfe6f0; border-radius: 12px; padding: 1.25rem; margin: 1rem 0; box-shadow: 0 3px 12px #1720330a; }
    .muted, small { color: #5c6b81; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; }
    .metric { min-width: 120px; flex: 1; background: #f6f8fc; border-radius: 9px; padding: 1rem; }
    .metric strong { display: block; font-size: 1.55rem; }
    label { display: block; font-weight: 600; margin: .8rem 0 .35rem; }
    input[type=text], input[type=url], input[type=password], input[type=file], select { width: 100%; max-width: 680px; padding: .7rem; border: 1px solid #bbc6d6; border-radius: 7px; background: white; }
    button, .button { display: inline-block; border: 0; border-radius: 7px; background: #1769d2; color: white; padding: .7rem 1rem; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { background: #0e55af; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .65rem; border-bottom: 1px solid #e6ebf2; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    th { color: #4d5c70; }
    .status { font-weight: 700; }
    .status-up { color: #16794b; }
    .status-down { color: #ba2435; }
    .status-other { color: #8a5a00; }
    .message { padding: .8rem 1rem; border-radius: 8px; background: #e8f3ff; margin: .75rem 0; }
    .errorlist, .error { color: #b42332; }
    .errorlist { margin: .3rem 0; padding-left: 1.2rem; }
    @media (max-width: 650px) { main { margin-top: 1rem; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'dashboard' %}"><strong>Website Health Check</strong></a>
    {% if user.is_authenticated %}
      <span>{{ user.username }}
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}<button type="submit">Log out</button>
        </form>
      </span>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
